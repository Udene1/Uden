changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "🔐 Security"
      labels:
        - "security"
    - title: "📦 Distribution"
      labels:
        - "distribution"
        - "release"
    - title: "🧰 Maintenance"
      labels:
        - "chore"
        - "dependencies"
  exclude:
    labels:
      - "skip-changelog"
      - "duplicate"
      - "invalid"
