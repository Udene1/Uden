# Android packaging is intentionally verified on every mobile/workflow change.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'clients/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build sideloadable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        working-directory: .
        run: npm ci
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo project
        run: npx expo config --type public
      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Align Kotlin with Compose compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android')
          files = list(root.rglob('*.gradle')) + list(root.rglob('*.gradle.kts')) + list(root.rglob('*.properties'))
          changed = []
          for path in files:
              text = path.read_text()
              updated = text.replace('1.9.24', '1.9.25')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No generated Android Kotlin version declaration was found to align.')
          print('Aligned Kotlin declarations:')
          for path in changed:
              print(path)
          PY
          grep -R 'kotlin.*1\.9\.25' android --include='*.gradle' --include='*.gradle.kts' --include='*.properties' | head -20
      - name: Build debug APK
        working-directory: clients/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK output
        working-directory: clients/mobile
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        working-directory: clients/mobile
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Uden-preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uden-android-apk
          path: clients/mobile/android/app/build/outputs/apk/debug/Uden-preview.apk
          if-no-files-found: error
          retention-days: 14
