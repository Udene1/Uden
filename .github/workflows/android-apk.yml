name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'clients/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build sideloadable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo config --type public

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Align Kotlin with Compose compiler
        run: |
          printf '\nandroid.kotlinVersion=1.9.25\n' >> android/gradle.properties
          grep '^android.kotlinVersion=' android/gradle.properties

      - name: Build debug APK
        working-directory: clients/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: clients/mobile
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Uden-preview.apk
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uden-android-apk
          path: clients/mobile/android/app/build/outputs/apk/debug/Uden-preview.apk
          if-no-files-found: error
          retention-days: 14
