name: Android Preview Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-preview-release.yml'
      - 'clients/mobile/**'
      - 'packages/shared/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo config --type public

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Verify generated Kotlin toolchain
        working-directory: clients/mobile
        run: |
          test -f android/build.gradle
          grep -n 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25' android/build.gradle
          if grep -n '1\.9\.24' android/build.gradle android/gradle.properties 2>/dev/null; then
            echo 'Kotlin 1.9.24 remains in generated Android build inputs.'
            exit 1
          fi

      - name: Build preview APK
        working-directory: clients/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release files
        working-directory: clients/mobile
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Uden-Android-preview.apk
          sha256sum Uden-Android-preview.apk > Uden-Android-preview.apk.sha256
          cat Uden-Android-preview.apk.sha256

      - name: Verify APK is non-empty
        working-directory: clients/mobile
        run: test -s Uden-Android-preview.apk

      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        working-directory: clients/mobile
        run: |
          if git diff --name-only "$SHA^1" "$SHA" | grep -q '^.github/workflows/'; then
            echo 'Skipping release publication because this commit changes a workflow file.'
            echo 'A subsequent non-workflow mobile/shared commit will publish the preview with GITHUB_TOKEN.'
            exit 0
          fi

          TAG="android-preview-${SHA:0:12}"
          gh release create "$TAG" \
            Uden-Android-preview.apk \
            Uden-Android-preview.apk.sha256 \
            --target "$SHA" \
            --prerelease \
            --title "Uden Android Preview ${SHA:0:12}" \
            --notes "Installable Android preview built from commit $SHA.\n\nThis APK is a debug/sideloadable preview build, not a production-signed release. Verify the published SHA-256 checksum before installation."
