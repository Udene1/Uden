name: Android Preview Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-preview-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-preview:
    name: Build and publish Android preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo config --type public

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Align Kotlin with Compose compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = [Path('android'), Path('node_modules/expo-modules-core/android')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob('*.gradle'))
                  files.extend(root.rglob('*.gradle.kts'))
                  files.extend(root.rglob('*.properties'))
          changed = []
          for path in files:
              text = path.read_text()
              updated = text.replace('1.9.24', '1.9.25')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No Kotlin 1.9.24 declaration was found to align.')
          print('Aligned Kotlin declarations:')
          for path in changed:
              print(path)
          PY

      - name: Build preview APK
        working-directory: clients/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release files
        working-directory: clients/mobile
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Uden-Android-preview.apk
          sha256sum Uden-Android-preview.apk > Uden-Android-preview.apk.sha256
          cat Uden-Android-preview.apk.sha256

      - name: Verify APK is non-empty
        working-directory: clients/mobile
        run: test -s Uden-Android-preview.apk

      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        working-directory: clients/mobile
        run: |
          TAG="android-preview-${SHA:0:12}"
          gh release create "$TAG" \
            Uden-Android-preview.apk \
            Uden-Android-preview.apk.sha256 \
            --target "$SHA" \
            --prerelease \
            --title "Uden Android Preview ${SHA:0:12}" \
            --notes "Installable Android preview built from commit $SHA.\n\nThis APK is a debug/sideloadable preview build, not a production-signed release. Verify the published SHA-256 checksum before installation."
