name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'clients/mobile/**'
      - 'packages/shared/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo config --type public

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Verify generated Kotlin toolchain
        run: |
          test -f android/build.gradle
          grep -n 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25' android/build.gradle
          if grep -n '1\\.9\\.24' android/build.gradle android/gradle.properties 2>/dev/null; then
            echo 'Kotlin 1.9.24 remains in generated Android build inputs.'
            exit 1
          fi

      - name: Build release APK
        working-directory: clients/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign standalone APK
        working-directory: clients/mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/uden-release.keystore"
          ALIGNED="$RUNNER_TEMP/uden-release-aligned.apk"
          OUT="Uden-Android-release.apk"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "uden-release" \
            -keypass "uden-release" \
            -alias uden-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Uden Release, OU=Uden, O=Uden, L=Unknown, ST=Unknown, C=NG" \
            -noprompt

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:uden-release \
            --key-pass pass:uden-release \
            --out "$OUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "Release APK:"
          ls -lh "$OUT"
          cat "$OUT.sha256"

      - name: Verify no Metro development server dependency
        working-directory: clients/mobile
        run: |
          set -euo pipefail
          if unzip -p Uden-Android-release.apk assets/index.android.bundle >/dev/null 2>&1; then
            echo "Embedded Android JavaScript bundle present."
          else
            echo "ERROR: release APK does not contain the embedded Android JavaScript bundle."
            exit 1
          fi
          if unzip -l Uden-Android-release.apk | grep -E 'index\.android\.bundle|\.bundle$'; then
            echo "Bundle inspection passed."
          else
            echo "ERROR: no embedded JavaScript bundle found."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        working-directory: clients/mobile
        run: |
          TAG="android-release-${SHA:0:12}"
          gh release create "$TAG" \
            Uden-Android-release.apk \
            Uden-Android-release.apk.sha256 \
            --target "$SHA" \
            --title "Uden Android Release ${SHA:0:12}" \
            --notes "Standalone Android release built from commit $SHA.

The JavaScript bundle is embedded in the APK. The app does not require Metro, localhost:8081, USB debugging, or a laptop to start.

Android package: icu.uden.app
Production engine: https://ai-work-partner-engine.uden-production-deployment.workers.dev"
