name: Desktop Client

on:
  pull_request:
    paths:
      - 'clients/desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop-client.yml'
  push:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop-client.yml'

jobs:
  build:
    name: Build desktop client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Build desktop frontend
        run: npm run build

  native-check:
    name: Check Tauri native bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check
