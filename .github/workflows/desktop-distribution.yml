name: Desktop Distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop-distribution.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'clients/desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop-distribution.yml'

jobs:
  native:
    name: ${{ matrix.platform }} ${{ matrix.arch }} artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact: uden-windows-x64
          - platform: windows
            arch: arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            artifact: uden-windows-arm64
          - platform: macos
            arch: universal
            runner: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: uden-macos-universal
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact: uden-linux-x64
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            artifact: uden-linux-arm64
    defaults:
      run:
        working-directory: clients/desktop
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate desktop version
        run: node scripts/verify-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Windows ARM64 build tools
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            & $installer modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart --wait
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw 'Visual Studio ARM64 C++ build tools are unavailable.' }

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native icon assets
        run: npm run tauri -- icon src-tauri/icons/uden.svg

      - name: Build native installers
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Verify Windows x64 installers
        if: matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $root = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $exe = @(Get-ChildItem -Path "$root/nsis" -Filter '*-setup.exe')
          if ($exe.Count -lt 1) { throw 'Windows x64 NSIS installer was not produced.' }
          $msi = @(Get-ChildItem -Path "$root/msi" -Filter '*.msi')
          if ($msi.Count -lt 1) { throw 'Windows x64 MSI installer was not produced.' }
          Write-Host "Windows x64 installer: $($exe[0].FullName)"

      - name: Verify Windows ARM64 installer
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $root = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $exe = @(Get-ChildItem -Path "$root/nsis" -Filter '*-setup.exe')
          if ($exe.Count -lt 1) { throw 'Windows ARM64 NSIS installer was not produced.' }
          Write-Host "Windows ARM64 installer: $($exe[0].FullName)"

      - name: Verify macOS universal bundle
        if: matrix.platform == 'macos'
        run: |
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$(find "$root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$dmg"
          binary="$(find "$app/Contents/MacOS" -type f -perm -111 -print -quit)"
          test -n "$binary"
          archs="$(lipo -archs "$binary")"
          echo "macOS universal architectures: $archs"
          echo "$archs" | grep -qw arm64
          echo "$archs" | grep -qw x86_64

      - name: Verify Linux x64 installers
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          test -n "$(find "$root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find "$root/deb" -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Verify Linux ARM64 installers
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          test -n "$(find "$root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find "$root/deb" -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Upload native installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            clients/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  microsoft-store:
    name: Microsoft Store installer
    runs-on: windows-latest
    needs: native
    defaults:
      run:
        working-directory: clients/desktop
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate desktop version
        run: node scripts/verify-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native icon assets
        run: npm run tauri -- icon src-tauri/icons/uden.svg

      - name: Build Microsoft Store installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --config src-tauri/tauri.microsoftstore.conf.json

      - name: Verify Microsoft Store installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one Store NSIS installer, found $($files.Count)." }
          Write-Host "Store installer: $($files[0].FullName)"

      - name: Upload Microsoft Store installer
        uses: actions/upload-artifact@v4
        with:
          name: uden-microsoft-store-installer
          path: clients/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
