name: Engine Deploy (Cloudflare)
# Trigger deployment when provider secrets are refreshed in GitHub Actions.
# Real provider diagnostic is intentionally run on every engine deployment.

on:
  workflow_dispatch:
    inputs:
      bootstrap_database:
        description: "Initialize the production D1 schema and legacy migrations on first deployment"
        required: true
        default: true
        type: boolean
  push:
    branches: [main, feat/cloudflare-free-tier-engine]
    paths:
      - "packages/engine/**"
      - "packages/shared/**"
      - ".github/workflows/engine-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: packages/engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Verify Cloudflare credentials
        run: npx wrangler whoami

      - name: Verify workers.dev account subdomain
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          STATUS="$(printf '%s' "$RESPONSE" | tail -n1)"
          BODY="$(printf '%s' "$RESPONSE" | sed '$d')"
          echo "workers.dev account subdomain GET status: $STATUS"
          echo "workers.dev account subdomain GET response: $BODY"
          test "$STATUS" = "200"
          SUBDOMAIN="$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.result?.subdomain||"");})')"
          test -n "$SUBDOMAIN"
          echo "workers.dev account subdomain: $SUBDOMAIN.workers.dev"

      - name: Provision D1 database
        id: d1
        run: |
          set -euo pipefail
          DB_NAME="ai-work-partner-db"
          DB_JSON="$(npx wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$DB_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const a=Array.isArray(x)?x:(x.result||[]);const r=a.find(v=>v.name==="ai-work-partner-db");if(r)process.stdout.write(r.uuid||r.id||"");})')"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$DB_NAME"
            DB_JSON="$(npx wrangler d1 list --json)"
            DB_ID="$(printf '%s' "$DB_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const a=Array.isArray(x)?x:(x.result||[]);const r=a.find(v=>v.name==="ai-work-partner-db");if(r)process.stdout.write(r.uuid||r.id||"");})')"
          fi
          test -n "$DB_ID"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Provision KV namespace
        id: kv
        run: |
          set -euo pipefail
          KV_JSON="$(npx wrangler kv namespace list)"
          KV_ID="$(printf '%s' "$KV_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const a=Array.isArray(x)?x:(x.result||[]);const r=a.find(v=>v.title==="ai-work-partner-cache");if(r)process.stdout.write(r.id||"");})')"
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create ai-work-partner-cache
            KV_JSON="$(npx wrangler kv namespace list)"
            KV_ID="$(printf '%s' "$KV_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const a=Array.isArray(x)?x:(x.result||[]);const r=a.find(v=>v.title==="ai-work-partner-cache");if(r)process.stdout.write(r.id||"");})')"
          fi
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Provision Queues
        run: |
          set -euo pipefail
          QUEUE_LIST="$(npx wrangler queues list)"
          for Q in uden-task-graphs uden-task-graphs-dlq; do
            if ! printf '%s\n' "$QUEUE_LIST" | grep -Fq "$Q"; then
              npx wrangler queues create "$Q"
              QUEUE_LIST="$(npx wrangler queues list)"
            fi
          done

      - name: Generate production Wrangler config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          // Free-tier production deliberately excludes Cloudflare Containers/Sandbox.
          // The capability remains in src/index.sandbox.ts and the repository Dockerfile
          // for the later Workers Paid deployment.
          config.main = 'src/index.ts';
          config.workers_dev = true;
          delete config.containers;
          delete config.durable_objects;
          delete config.migrations;
          // Workflows are free-tier compatible, but this deployment token currently
          // lacks the permission required by Cloudflare's Workflow API. The engine
          // has an equivalent Queue fallback in scheduled(), so keep the free-tier
          // deployment operational until Workflow API permission is added.
          delete config.workflows;
          config.d1_databases[0].database_id = process.env.DB_ID;
          config.kv_namespaces[0].id = process.env.KV_ID;
          fs.writeFileSync('wrangler.production.jsonc', JSON.stringify(config, null, 2) + '\n');
          if (config.containers || config.durable_objects || config.migrations) {
            throw new Error('Paid Sandbox/Containers configuration leaked into the Free-tier deployment config');
          }
          NODE

      - name: Verify Free-tier deployment config
        run: |
          set -euo pipefail
          if grep -Eq '"(containers|durable_objects|migrations)"[[:space:]]*:' wrangler.production.jsonc; then
            echo "Paid Sandbox/Containers configuration is present in the production config"
            exit 1
          fi
          grep -q '"main": "src/index.ts"' wrangler.production.jsonc
          if grep -Eq '"workflows"[[:space:]]*:' wrangler.production.jsonc; then
            echo "Workflow binding leaked into the free-tier deployment config"
            exit 1
          fi

      - name: Deploy Worker
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc \
            --message "github:${GITHUB_SHA}" \
            --tag "github-${GITHUB_SHA:0:12}"

      - name: Verify active Cloudflare deployment
        run: |
          set -euo pipefail
          npx wrangler deployments status --name ai-work-partner-engine --json > deployment-status.json
          npx wrangler deployments list --name ai-work-partner-engine --json > deployment-list.json
          cat deployment-status.json
          cat deployment-list.json
          grep -q "$GITHUB_SHA" deployment-list.json
          echo "Cloudflare deployment is associated with commit $GITHUB_SHA"
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('deployment-list.json', 'utf8');
          const value = JSON.parse(raw);
          const list = Array.isArray(value) ? value : (value.result || value.deployments || []);
          const deployment = list.find((item) => JSON.stringify(item).includes(process.env.GITHUB_SHA));
          if (!deployment) throw new Error('Could not locate the deployed commit in Cloudflare deployment history');
          fs.writeFileSync('deployment-receipt.json', JSON.stringify({commit: process.env.GITHUB_SHA, worker: 'ai-work-partner-engine', deployment}, null, 2) + '\n');
          NODE

      - name: Bootstrap D1 schema and legacy migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_database || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          TABLES="$(npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='tenants'" --json)"
          if printf '%s' "$TABLES" | grep -q '"tenants"'; then
            echo "Production schema already exists; skipping one-time bootstrap."
            exit 0
          fi
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file=src/db/schema.sql
          for f in migrations/*.sql; do
            echo "Applying $f"
            npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file="$f"
          done

      - name: Ensure model usage telemetry migration exists
        run: |
          set -euo pipefail
          EXISTS="$(npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='usage_records'" --json)"
          if ! printf '%s' "$EXISTS" | grep -q '"usage_records"'; then
            echo "usage_records table is missing; bootstrap step should have created it."
            exit 1
          fi
          COLUMNS="$(npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "PRAGMA table_info(usage_records)" --json)"
          if printf '%s' "$COLUMNS" | grep -q '"actual_model"'; then
            echo "Model usage telemetry migration already applied."
          else
            echo "Applying migrations/0044_model_usage_telemetry.sql"
            npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file=migrations/0044_model_usage_telemetry.sql
          fi

      - name: Ensure registration permission tables exist
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file=migrations/0042_registration_permission_tables.sql
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file=migrations/0043_unified_client_sessions.sql

      - name: Verify durable model availability table
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc             --command "SELECT name FROM sqlite_master WHERE type='table' AND name='model_availability'"
          echo "Verified production D1 model_availability table."

      - name: Publish configured provider secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.production.jsonc
              echo "Published $name"
            fi
          }
          put_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          put_secret ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}"
          put_secret DEEPSEEK_API_KEY "${DEEPSEEK_API_KEY:-}"
          put_secret GEMINI_API_KEY "${GEMINI_API_KEY:-}"
          put_secret GOOGLE_AI_API_KEY "${GOOGLE_AI_API_KEY:-}"
          put_secret AGENTROUTER_API_KEY "${AGENTROUTER_API_KEY:-}"

      - name: Production health check
        run: |
          set -euo pipefail
          URL="https://ai-work-partner-engine.uden-production-deployment.workers.dev"
          curl --fail --retry 5 --retry-delay 3 "$URL/api/v1/health" -o health-response.json
          cat health-response.json

      - name: Production authentication smoke test
        run: |
          set -euo pipefail
          URL="https://ai-work-partner-engine.uden-production-deployment.workers.dev"
          TENANT_ID=""
          cleanup() {
            if [ -n "$TENANT_ID" ]; then
              set +e
              npx wrangler d1 execute DB --remote --config wrangler.production.jsonc \
                --command "DELETE FROM tenants WHERE id='$TENANT_ID'" >/tmp/uden-smoke-cleanup.log 2>&1
              cat /tmp/uden-smoke-cleanup.log
            fi
          }
          trap cleanup EXIT

          RESPONSE="$(curl --silent --show-error -w '\n%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST "$URL/api/v1/tenants" \
            --data "{\"name\":\"CI deployment smoke ${GITHUB_RUN_ID}\",\"email\":\"ci-${GITHUB_RUN_ID}@smoke.invalid\"}")"
          STATUS="$(printf '%s' "$RESPONSE" | tail -n1)"
          BODY="$(printf '%s' "$RESPONSE" | sed '$d')"
          echo "Registration smoke test HTTP status: $STATUS"
          if [ "$STATUS" != "201" ]; then
            echo "Registration smoke test response:"
            printf '%s\n' "$BODY"
            exit 1
          fi

          API_KEY="$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.api_key||"");})')"
          TENANT_ID="$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.tenant?.id||"");})' )"
          test -n "$API_KEY"
          test -n "$TENANT_ID"
          echo "Registration smoke test: PASS (tenant $TENANT_ID; API key received)"

          AUTH_RESPONSE="$(curl --silent --show-error -w '\n%{http_code}' \
            -H "Authorization: Bearer $API_KEY" "$URL/api/v1/tenant")"
          AUTH_STATUS="$(printf '%s' "$AUTH_RESPONSE" | tail -n1)"
          AUTH_BODY="$(printf '%s' "$AUTH_RESPONSE" | sed '$d')"
          echo "Authenticated tenant lookup HTTP status: $AUTH_STATUS"
          echo "Authenticated tenant lookup response: $AUTH_BODY"
          if [ "$AUTH_STATUS" != "200" ]; then
            echo "Authentication smoke test FAILED"
            exit 1
          fi
          echo "Production authentication smoke test: PASS"

      - name: Production authentication contract smoke test v2
        run: |
          set -euo pipefail
          URL="https://ai-work-partner-engine.uden-production-deployment.workers.dev"
          WORKDIR="$(mktemp -d)"
          TENANT_A=""; TENANT_B=""; TENANT_C=""
          cleanup() { set +e; for ID in "$TENANT_A" "$TENANT_B" "$TENANT_C"; do if [ -n "$ID" ]; then npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "DELETE FROM tenants WHERE id='$ID'" >/dev/null 2>&1; fi; done; rm -rf "$WORKDIR"; }
          trap cleanup EXIT
          call() {
            local name="$1" method="$2" path="$3" body="$4" token="$5"
            local args=(--silent --show-error --output "$WORKDIR/$name.body" --dump-header "$WORKDIR/$name.headers" -w '%{http_code}' -X "$method")
            if [ -n "$body" ]; then args+=(-H 'Content-Type: application/json' --data "$body"); fi
            if [ -n "$token" ]; then args+=(-H "Authorization: Bearer $token"); fi
            STATUS="$(curl "${args[@]}" "$URL$path")"
            REQUEST_ID="$(awk 'BEGIN{IGNORECASE=1} /^x-request-id:/ {gsub(/\r/,"",$2); print $2}' "$WORKDIR/$name.headers" | tail -n1)"
            printf '%-38s HTTP %-3s request_id=%s\n' "$1" "$STATUS" "$REQUEST_ID"
          }
          json() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const v=process.argv[1].split(".").reduce((a,k)=>a?.[k],x);process.stdout.write(v==null?"":String(v));})' "$2" < "$1"; }
          echo "=== Production authentication contract smoke test v2 ==="
          echo "run_id=$GITHUB_RUN_ID commit=$GITHUB_SHA"
          call register_a POST /api/v1/tenants "{\"name\":\"CI auth v2 $GITHUB_RUN_ID\",\"email\":\"ci-auth-v2-$GITHUB_RUN_ID@smoke.invalid\",\"client\":\"web\"}" ""
          test "$STATUS" = "201"
          API_KEY="$(json "$WORKDIR/register_a.body" api_key)"
          SESSION_A="$(json "$WORKDIR/register_a.body" session_token)"
          TENANT_A="$(json "$WORKDIR/register_a.body" tenant.id)"
          SUBJECT_A="$(json "$WORKDIR/register_a.body" subject)"
          EXPIRES_A="$(json "$WORKDIR/register_a.body" expires_at)"
          case "$API_KEY" in sk_*) ;; *) exit 1;; esac
          case "$SESSION_A" in us_*) ;; *) exit 1;; esac
          test "$SUBJECT_A" = "tenant:$TENANT_A"; test -n "$EXPIRES_A"
          call session_auth GET /api/v1/tenant "" "$SESSION_A"; test "$STATUS" = "200"; test "$(json "$WORKDIR/session_auth.body" tenant.id)" = "$TENANT_A"
          call logout POST /api/v1/auth/logout "" "$SESSION_A"; test "$STATUS" = "200"
          call revoked GET /api/v1/tenant "" "$SESSION_A"; test "$STATUS" = "401"
          call api_key_login POST /api/v1/auth/session "{\"apiKey\":\"$API_KEY\",\"client\":\"desktop\"}" ""; test "$STATUS" = "201"
          SESSION_DESKTOP="$(json "$WORKDIR/api_key_login.body" session_token)"; case "$SESSION_DESKTOP" in us_*) ;; *) exit 1;; esac
          call desktop_auth GET /api/v1/tenant "" "$SESSION_DESKTOP"; test "$STATUS" = "200"
          call invalid_session GET /api/v1/tenant "" us_invalid_smoke_v2; test "$STATUS" = "401"
          call invalid_api_key POST /api/v1/auth/session '{"apiKey":"sk_invalid_smoke_v2","client":"web"}' ""; test "$STATUS" = "401"
          call register_b POST /api/v1/tenants "{\"name\":\"CI auth isolation v2 $GITHUB_RUN_ID\",\"email\":\"ci-auth-isolation-v2-$GITHUB_RUN_ID@smoke.invalid\",\"client\":\"mobile\"}" ""; test "$STATUS" = "201"
          SESSION_B="$(json "$WORKDIR/register_b.body" session_token)"; TENANT_B="$(json "$WORKDIR/register_b.body" tenant.id)"
          test -n "$TENANT_B"; test "$TENANT_B" != "$TENANT_A"
          call tenant_b_auth GET /api/v1/tenant "" "$SESSION_B"; test "$STATUS" = "200"; test "$(json "$WORKDIR/tenant_b_auth.body" tenant.id)" = "$TENANT_B"
          # Negative contract checks
          call malformed_api_key POST /api/v1/auth/session '{"apiKey":"not-an-api-key","client":"web"}' ""; test "$STATUS" = "401"
          call malformed_session GET /api/v1/tenant "" "not-a-session"; test "$STATUS" = "401"
          call wrong_registration_client POST /api/v1/tenants "{\"name\":\"CI invalid client $GITHUB_RUN_ID\",\"email\":\"ci-invalid-client-$GITHUB_RUN_ID@smoke.invalid\",\"client\":\"tablet\"}" ""; test "$STATUS" = "400"
          call wrong_client POST /api/v1/auth/session "{\"apiKey\":\"$API_KEY\",\"client\":\"tablet\"}" ""; test "$STATUS" = "400"

          call logout_twice POST /api/v1/auth/logout "" "$SESSION_DESKTOP"; test "$STATUS" = "200"
          call logout_twice_again POST /api/v1/auth/logout "" "$SESSION_DESKTOP"; test "$STATUS" = "200"
          call logout_twice_revoked GET /api/v1/tenant "" "$SESSION_DESKTOP"; test "$STATUS" = "401"

          EXPIRED_TOKEN="us_expired_${GITHUB_RUN_ID}"
          EXPIRED_HASH="$(node -e 'const c=require("crypto");process.stdout.write(c.createHash("sha256").update(process.argv[1]).digest("hex"))' "$EXPIRED_TOKEN")"
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "INSERT INTO auth_sessions(id,tenant_id,subject,token_hash,client,expires_at) VALUES('smoke-expired-${GITHUB_RUN_ID}','$TENANT_A','tenant:$TENANT_A','$EXPIRED_HASH','web','2000-01-01T00:00:00.000Z')" >/dev/null
          call expired_session GET /api/v1/tenant "" "$EXPIRED_TOKEN"; test "$STATUS" = "401"

          FORGED_B_TOKEN="us_forged_b_${GITHUB_RUN_ID}"
          FORGED_B_HASH="$(node -e 'const c=require("crypto");process.stdout.write(c.createHash("sha256").update(process.argv[1]).digest("hex"))' "$FORGED_B_TOKEN")"
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "INSERT INTO auth_sessions(id,tenant_id,subject,token_hash,client,expires_at) VALUES('smoke-forged-b-${GITHUB_RUN_ID}','$TENANT_B','tenant:$TENANT_A','$FORGED_B_HASH','web','2099-01-01T00:00:00.000Z')" >/dev/null
          call tenant_a_principal_on_b GET /api/v1/tenant "" "$FORGED_B_TOKEN"; test "$STATUS" = "401"

          SUBJECT_TEST="tenant:attacker-${GITHUB_RUN_ID}"
          call arbitrary_subject_register POST /api/v1/tenants "{\"name\":\"CI subject test $GITHUB_RUN_ID\",\"email\":\"ci-subject-$GITHUB_RUN_ID@smoke.invalid\",\"client\":\"web\",\"subject\":\"$SUBJECT_TEST\"}" ""
          test "$STATUS" = "201"
          SUBJECT_TEST_RETURNED="$(json "$WORKDIR/arbitrary_subject_register.body" subject)"
          SUBJECT_TEST_TENANT="$(json "$WORKDIR/arbitrary_subject_register.body" tenant.id)"
          test "$SUBJECT_TEST_RETURNED" = "tenant:$SUBJECT_TEST_TENANT"
          TENANT_C="$SUBJECT_TEST_TENANT"
          echo "registration_session_verified=true"
          echo "malformed_api_key_rejected=true"
          echo "malformed_session_rejected=true"
          echo "expired_session_rejected=true"
          echo "principal_tenant_mismatch_rejected=true"
          echo "arbitrary_subject_ignored=true"
          echo "invalid_client_rejected=true"
          echo "logout_idempotent=true"
          echo "session_revocation_verified=true"
          echo "api_key_to_session_verified=true"
          echo "invalid_credentials_rejected=true"
          echo "tenant_isolation_verified=true"
          echo "request_ids_captured=true"
          echo "raw_credentials_printed=false"
          echo "Production authentication contract smoke test v2: PASS"

      - name: Production real provider execution diagnostic
        run: |
          set -euo pipefail
          URL="https://ai-work-partner-engine.uden-production-deployment.workers.dev"
          WORKDIR="$(mktemp -d)"
          TENANT_ID=""
          cleanup() { set +e; if [ -n "$TENANT_ID" ]; then npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command "DELETE FROM tenants WHERE id='$TENANT_ID'" >/dev/null 2>&1; fi; rm -rf "$WORKDIR"; }
          trap cleanup EXIT
          echo "=== REAL PROVIDER EXECUTION DIAGNOSTIC ==="
          echo "commit=$GITHUB_SHA run_id=$GITHUB_RUN_ID"
          REG="$(curl --silent --show-error -w '\n%{http_code}' -H 'Content-Type: application/json' -X POST "$URL/api/v1/tenants" --data "$(printf '%s' "{\"name\":\"CI provider diagnostic $GITHUB_RUN_ID\",\"email\":\"ci-provider-$GITHUB_RUN_ID@smoke.invalid\",\"client\":\"web\"}")")"
          REG_STATUS="$(printf '%s' "$REG" | tail -n1)"
          REG_BODY="$(printf '%s' "$REG" | sed '$d')"
          echo "registration_http=$REG_STATUS"
          test "$REG_STATUS" = "201" || { echo "$REG_BODY"; exit 1; }
          SESSION="$(printf '%s' "$REG_BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).session_token||""))')"
          TENANT_ID="$(printf '%s' "$REG_BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).tenant?.id||""))')"
          test -n "$SESSION"; test -n "$TENANT_ID"
          COOKIE="uden_session=$SESSION"
          DIRECT="$(curl --silent --show-error -w '\n%{http_code}' -H "Cookie: $COOKIE" -H 'Content-Type: application/json' -X POST "$URL/api/v1/tasks" --data '{"prompt":"Reply with exactly: PROVIDER_SMOKE_OK","permissionless":true}')"
          DIRECT_STATUS="$(printf '%s' "$DIRECT" | tail -n1)"
          DIRECT_BODY="$(printf '%s' "$DIRECT" | sed '$d')"
          echo "direct_task_http=$DIRECT_STATUS"
          echo "--- DIRECT TASK DIAGNOSTIC RESPONSE ---"
          echo "$DIRECT_BODY"
          test "$DIRECT_STATUS" = "200" || { echo "DIAG failure_stage=task_execution_or_provider"; exit 1; }
          DIRECT_STATE="$(printf '%s' "$DIRECT_BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.task?.status||"")})')"
          test "$DIRECT_STATE" = "completed" || { echo "DIAG failure_stage=provider_execution"; exit 1; }
          echo "DIAG direct_provider_execution=PASS"
          GRAPH='{"goal":"Provider graph smoke test","nodes":[{"id":"provider-smoke","title":"Provider smoke","prompt":"Reply with exactly: PROVIDER_GRAPH_SMOKE_OK","dependencies":[],"contextFrom":[],"kind":"model"}]}'
          GRAPH_RESPONSE="$(curl --silent --show-error -w '\n%{http_code}' -H "Cookie: $COOKIE" -H 'Content-Type: application/json' -X POST "$URL/api/v1/tasks/graph/execute" --data "$(printf '%s' "{\"plan\":$GRAPH}")")"
          GRAPH_STATUS="$(printf '%s' "$GRAPH_RESPONSE" | tail -n1)"
          GRAPH_BODY="$(printf '%s' "$GRAPH_RESPONSE" | sed '$d')"
          echo "graph_execute_http=$GRAPH_STATUS"
          echo "--- GRAPH EXECUTION DIAGNOSTIC RESPONSE ---"
          echo "$GRAPH_BODY"
          test "$GRAPH_STATUS" = "200" || { echo "DIAG failure_stage=graph_route"; exit 1; }
          GRAPH_STATE="$(printf '%s' "$GRAPH_BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const n=x.graph?.nodes?.[0]||{};process.stdout.write((x.status||"")+"|"+(n.status||"")+"|"+(n.error||"")+"|"+(n.selectedModel||""))})')"
          GRAPH_RESULT="$(printf '%s' "$GRAPH_STATE" | cut -d'|' -f1)"
          NODE_RESULT="$(printf '%s' "$GRAPH_STATE" | cut -d'|' -f2)"
          NODE_ERROR="$(printf '%s' "$GRAPH_STATE" | cut -d'|' -f3)"
          NODE_MODEL="$(printf '%s' "$GRAPH_STATE" | cut -d'|' -f4)"
          echo "DIAG graph_status=$GRAPH_RESULT node_status=$NODE_RESULT selected_model=$NODE_MODEL"
          if [ "$GRAPH_RESULT" != "completed" ] || [ "$NODE_RESULT" != "completed" ]; then
            echo "DIAG failure_stage=graph_provider_execution"
            echo "DIAG graph_node_error=$NODE_ERROR"
            exit 1
          fi
          echo "DIAG graph_provider_execution=PASS actual_model=$NODE_MODEL"
          echo "Production real provider execution diagnostic: PASS"

      - name: Write deployment receipt and summary
        if: ${{ always() }}
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "workflow": "Engine Deploy (Cloudflare)",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF_NAME"],
              "worker": "ai-work-partner-engine",
              "url": "https://ai-work-partner-engine.uden-production-deployment.workers.dev",
              "status": os.environ["DEPLOYMENT_STATUS"],
          }
          for name in ("deployment-status.json", "deployment-list.json", "health-response.json"):
              path = Path(name)
              if path.exists():
                  try: receipt[name[:-5]] = json.loads(path.read_text())
                  except Exception: receipt[name[:-5]] = path.read_text()
          Path("deployment-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
          {
            echo "## Cloudflare deployment"
            echo
            echo "- **Commit:** \`$GITHUB_SHA\`"
            echo "- **Worker:** \`ai-work-partner-engine\`"
            echo "- **URL:** https://ai-work-partner-engine.uden-production-deployment.workers.dev"
            echo "- **Job status:** \`$DEPLOYMENT_STATUS\`"
            if [ -f health-response.json ]; then echo "- **Health check:** PASS"; else echo "- **Health check:** NOT REACHED"; fi
            if [ "$DEPLOYMENT_STATUS" = "success" ]; then echo "- **Deployment verification:** PASS"; else echo "- **Deployment verification:** FAILED"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-receipt-${{ github.run_id }}
          path: |
            packages/engine/deployment-receipt.json
            packages/engine/deployment-status.json
            packages/engine/deployment-list.json
            packages/engine/health-response.json
          if-no-files-found: warn
          retention-days: 14