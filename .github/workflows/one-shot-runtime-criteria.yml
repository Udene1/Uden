name: one-shot-runtime-criteria
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch executor and add focused tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/engine/src/services/graph-executor.ts')
          s = p.read_text()
          if 'function nodeSuccessCriteria' not in s:
              marker = 'async function executeProjectToolNode('
              helper = "function nodeSuccessCriteria(node:TaskNode):string|undefined{const value=(node.toolInput as Record<string,unknown>|undefined)?.successCriteria;return typeof value==='string'&&value.trim()?value.trim():undefined}\n"
              if marker not in s: raise SystemExit('executor marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace('verifyRuntimeResult(result);', 'verifyRuntimeResult(result,nodeSuccessCriteria(node));')
          p.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/engine/src/services/graph-executor.ts
          git rm .github/workflows/one-shot-runtime-criteria.yml
          git diff --cached --quiet || git commit -m 'fix(graph): honor runtime success criteria'
          git push
