[package]
name = "uden-desktop"
version = "0.1.0"
description = "Uden desktop native execution bridge"
authors = ["Uden"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
uuid = { version = "1", features = ["v4"] }
